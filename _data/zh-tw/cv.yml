- title: 經歷
  type: time_table
  contents:
    - title: 助理教授
      institution: 國立臺灣大學土木工程學系，臺灣
      year: 2025 - 至今
      description:
        - 開授課程包含鋼結構設計、機器人學導論、實體模型設計實作、結構力學專題討論、結構工程與流體力學實驗。
        - 臺大土木系環保暨職業安全衛生委員會委員。
        - 第十八屆結構工程研討會暨第八屆地震工程研討會籌備委員。
    - title: 研究助理（博士班）
      institution: 加州大學聖地牙哥分校（UCSD），美國
      year: 2019 - 2025
      description:
        - 驗證全球最大戶外振動台（LHPOST6）升級工程之設計，並協助 UCSD 與 NSF 分析驗收測試資料。
        - 建立六自由度振動台系統之完整非線性動力模型（數位孿生），涵蓋伺服液壓動力學與非線性耗能行為。
        - 以 MATLAB/OpenSEES 耦合模擬研究振動台與十層樓木構造試體（TallWood）之動力互制。
        - 開發 Python/MATLAB 系統識別、訊號處理與實驗資料轉換工具。
    - title: 授課講師
      institution: 加州大學聖地牙哥分校（UCSD），美國
      year: 2023
      description:
        - 課程：SE130A 結構分析（一）（2023 夏季）。
    - title: 助理研究員／助理技術師
      institution: 國家地震工程研究中心（NCREE），臺灣
      year: 2016 - 2019
      description:
        - NCREE 臺南實驗室 8m×8m 六自由度振動台系統第一代主控操作人員（2017 年啟用）。
        - 主導 2m×2m Stewart 平台式振動台系統之採購與驗收測試。
        - 設計彈簧-質量式被動傳遞系統並導入適應性回饋控制。
    - title: 研究助理（碩士班）
      institution: 國立臺灣大學，臺灣
      year: 2014 - 2016
      description:
        - 發展以振動台重現高樓層樓板地震反應之控制策略。
        - 以模型為基礎之回饋控制改善單軸向振動台加速度追蹤性能。

