- title: Experience
  type: time_table
  contents:
    - title: Assistant Professor
      institution: Department of Civil Engineering, National Taiwan University, Taiwan
      year: 2025 - now
      description:
        - Courses taught include Design of Steel Structure, Introduction to Robotics, Physical Model Design Laboratory, Seminar in Structural Mechanics, and Structural Engineering and Fluid Mechanics Lab.
    - title: Graduate Research Assistant
      institution: University of California San Diego, US
      year: 2019 - 2025
      description:
        - Validated the design of the upgrade project for the world's largest outdoor shake table (LHPOST6) and analyzed acceptance test data for UCSD and NSF.
        - Developed a comprehensive nonlinear dynamic model (digital twin) of the 6-DOF shake table system, including servo-hydraulic dynamics and dissipative forces.
        - Studied the dynamic interaction between the shake table and the 10-story TallWood building specimen via coupled MATLAB/OpenSEES simulation.
        - Developed Python/MATLAB toolkits for system identification, signal processing, and laboratory data conversion.
    - title: Instructor / Lecturer
      institution: University of California San Diego, US
      year: 2023
      description:
        - "Course: SE130A Structural Analysis I (Summer 2023)."
    - title: Junior Researcher / Assistant Technician
      institution: National Center for Research on Earthquake Engineering (NCREE), Taiwan
      year: 2016 - 2019
      description:
        - First-generation chief operator of the 8m×8m 6-DOF shake table system at NCREE Tainan Laboratory (opened 2017).
        - Led procurement and acceptance testing of a 2m×2m Stewart-platform shake table system.
        - Designed a spring-mass passive transfer system for shake table testing with adaptive feedback control.
    - title: Graduate Research Assistant
      institution: National Taiwan University, Taiwan
      year: 2014 - 2016
      description:
        - Developed control strategies for floor response reproduction of high-rise buildings using shake tables.
        - Improved acceleration-tracking performance of a uni-axial shake table via model-based feedback control.

